version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
      test:
        patterns:
          - "org.junit:*"
    ignore:
      - dependency-name: "com.helger*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
